name: CI

# Runs on every pull request into main, and on main itself after a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres 18 + PostGIS 3.6, matching setup/01-dev-environment.md. Exposed
    # on the runner's own localhost:5432, not a container job, so steps below
    # reach it as an ordinary local Postgres.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what package-lock.json says, nothing newer.
      - run: npm ci

      # src/generated is gitignored -- Prisma's client is build output, not source,
      # and committing 2.9 MB of generated TypeScript would put it in every diff.
      # So a fresh checkout has no client, and lint, typecheck and build all fail
      # on "Cannot find module '../generated/prisma/client.js'" without this step.
      # Prisma 7 has no install-time generate hook, so it is spelled out here.
      # It needs no database: generate reads prisma/schema.prisma and nothing else.
      # Review finding R1.1.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Mirrors setup/01-dev-environment.md's local recipe (createdb -O
      # tradeservice, then CREATE EXTENSION as postgres). The connecting role
      # for migrations and tests must NOT be the superuser: it must not own
      # PostGIS's own tables, because tests/helpers/database.ts drops every
      # table the connecting role owns between test files, and dropping
      # spatial_ref_sys out from under the postgis extension fails hard.
      # ubuntu-latest ships psql and createdb already; nothing to install.
      - name: Create test role, database and PostGIS extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE tradeservice LOGIN PASSWORD 'tradeservice';"
          createdb -h localhost -U postgres -O tradeservice tradeservice_test
          psql -h localhost -U postgres -d tradeservice_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      # Same command tests/global-setup.ts runs locally before every run. Kept
      # as its own step so a broken migration fails here, clearly labelled,
      # rather than surfacing as a vitest global-setup crash.
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://tradeservice:tradeservice@localhost:5432/tradeservice_test
        run: npx prisma migrate deploy

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://tradeservice:tradeservice@localhost:5432/tradeservice_test
        run: npm test
