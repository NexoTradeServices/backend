# Fly.io configuration for the tradeservice API.
#
# Nothing secret lives here - this file is committed. DATABASE_URL, DIRECT_URL
# and WEB_ORIGIN are set with `fly secrets set`, which stores them encrypted and
# injects them as environment variables at boot.

# Must match the app that exists on Fly. Named at launch, and Fly has no easy
# rename, so the file follows the app rather than the other way round.
app = "tradeservices"
primary_region = "syd"

[deploy]
  release_command = "npx prisma migrate deploy"

  [deploy.release_command_vm]
    size = "performance-1x"
    memory = "512mb"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # No machine kept awake. Fly starts one on the next request, which costs a
  # 2-6 second wait on that first hit. Fine while nothing but us is calling the
  # API; set min_machines_running back to 1 before a customer ever sees the
  # enquiry form, because a cold start there is a spinner on a stranger's screen.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Deliberately /health and not /health/db. This check decides whether the
    # machine itself is alive; if Neon hiccups we want the API up and reporting
    # 503 on one route, not Fly tearing the machine down and restarting it.
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
